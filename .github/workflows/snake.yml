name: generate animation

on:
  # run automatically every 24 hours so the snake stays in sync with new contributions
  schedule:
    - cron: "0 */24 * * *"
  # lets you trigger it manually from the Actions tab
  workflow_dispatch:
  # regenerate whenever you push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # generates a snake animation from your contribution graph
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # pushes the generated svg files to an "output" branch,
      # so they're servable at raw.githubusercontent.com
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
